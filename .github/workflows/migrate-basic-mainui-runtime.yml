name: Migrate Basic runtime to MainUi

on:
  push:
    branches: [architecture/maincourse-mainui]
    paths:
      - ".github/workflows/migrate-basic-mainui-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: basic-mainui-runtime-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v5
        with:
          ref: architecture/maincourse-mainui
          fetch-depth: 0

      - name: Move shared presentation behind MainUi
        run: python3 scripts/migrate_basic_mainui_runtime.py

      - name: Commit runtime migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/asdevelopers/academy/basic/BasicAcademyApp.kt
          if git diff --cached --quiet; then
            echo "Runtime already migrated."
            exit 0
          fi
          git commit -m "refactor: route Basic presentation through MainUi"
          git pull --rebase origin architecture/maincourse-mainui
          git push origin HEAD:architecture/maincourse-mainui
