name: Finalize Basic architecture README

on:
  push:
    branches: [architecture/maincourse-mainui]
    paths:
      - ".github/workflows/migrate-basic-mainui-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: basic-mainui-runtime-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v5
        with:
          ref: architecture/maincourse-mainui
          fetch-depth: 0

      - name: Update README for MainCourse and MainUi architecture
        run: python3 scripts/update_basic_readme_architecture.py

      - name: Commit README migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README already migrated."
            exit 0
          fi
          git commit -m "docs: document MainCourse MainUi thin-host architecture"
          git pull --rebase origin architecture/maincourse-mainui
          git push origin HEAD:architecture/maincourse-mainui
