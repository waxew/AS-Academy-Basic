name: Publish AS Academy Basic 1.0.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-1.0.0.yml

permissions:
  contents: write

jobs:
  publish:
    name: Build, sign, verify and publish Basic 1.0.0
    runs-on: ubuntu-latest
    steps:
      # Checkout exact release source into a named folder so Core can sit beside it.
      - name: Checkout Basic
        uses: actions/checkout@v5
        with:
          path: AS-Academy-Basic
          fetch-depth: 0

      # Core remains the single source of truth for compiler/runtime behavior.
      - name: Checkout AS Academy Core
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-Core
          ref: main
          path: AS-Academy-Core

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 and signing tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Re-run the same contract checks on the exact commit that will be published.
      - name: Validate release Course Package
        working-directory: AS-Academy-Core
        run: ./gradlew :tools:run --args="validate ../AS-Academy-Basic/course/basic" --stacktrace

      - name: Compile release Course Bundle
        working-directory: AS-Academy-Core
        run: ./gradlew :tools:run --args="compile ../AS-Academy-Basic/course/basic ../AS-Academy-Basic/app/src/main/assets/basic-course.json" --stacktrace

      - name: Lint and build debug/release variants
        working-directory: AS-Academy-Basic
        run: ../AS-Academy-Core/gradlew -p . :app:lintDebug :app:assembleDebug :app:assembleRelease --stacktrace

      # The first stable signing key is generated only in this isolated runner and never committed.
      - name: Generate stable 1.0.0 signing key and sign publish APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private-signing release-output
          export STOREPASS="$(openssl rand -hex 32)"
          export KEYPASS="$(openssl rand -hex 32)"
          export KEY_ALIAS="as-academy-basic"
          export KEYSTORE_FILE="private-signing/AS-Academy-Basic-1.0.0-release.keystore"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE_FILE" \
            -storetype JKS \
            -storepass "$STOREPASS" \
            -keypass "$KEYPASS" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=AS Academy Basic, OU=AS Academy, O=AS Team Group, L=Baku, C=AZ"

          UNSIGNED_APK=$(find AS-Academy-Basic/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$UNSIGNED_APK"

          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$ZIPALIGN" -p -f 4 "$UNSIGNED_APK" release-output/AS-Academy-Basic-1.0.0-aligned.apk
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STOREPASS \
            --key-pass env:KEYPASS \
            --out release-output/AS-Academy-Basic-1.0.0.apk \
            release-output/AS-Academy-Basic-1.0.0-aligned.apk
          rm release-output/AS-Academy-Basic-1.0.0-aligned.apk

          "$APKSIGNER" verify --verbose --print-certs release-output/AS-Academy-Basic-1.0.0.apk \
            > release-output/signature-verify.txt 2>&1

          cp AS-Academy-Basic/app/build/outputs/apk/debug/app-debug.apk \
            release-output/AS-Academy-Basic-1.0.0-debug.apk
          cp AS-Academy-Basic/release/release-pack-public-cert.pem \
            release-output/release-pack-public-cert.pem

          cat > private-signing/info.txt <<EOF
          AS Academy Basic 1.0.0 private signing information
          ==================================================
          Package: com.asdevelopers.academy.basic
          Version Name: 1.0.0
          Version Code: 9
          Keystore: AS-Academy-Basic-1.0.0-release.keystore
          Store Type: JKS
          Alias: $KEY_ALIAS
          Store Password: $STOREPASS
          Key Password: $KEYPASS

          IMPORTANT: Keep this keystore and both passwords private and permanent.
          Every future APK update for com.asdevelopers.academy.basic must be signed with this exact key.
          EOF

          tar -C private-signing -czf signing-private-pack.tar.gz \
            AS-Academy-Basic-1.0.0-release.keystore info.txt

          # Encrypt the private signing pack to the offline certificate whose private key is delivered separately to the owner.
          openssl cms -encrypt -binary -aes256 \
            -in signing-private-pack.tar.gz \
            -out release-output/AS-Academy-Basic-1.0.0-signing-private.cms \
            -outform DER \
            AS-Academy-Basic/release/release-pack-public-cert.pem

          rm -rf signing-private-pack.tar.gz private-signing

      # Source ZIP is made from the exact Git commit; generated build output is intentionally excluded.
      - name: Package source and public release metadata
        shell: bash
        run: |
          set -euo pipefail
          git -C AS-Academy-Basic archive \
            --format=zip \
            --output="$(pwd)/release-output/source.as-academy-basic-1.0.0.zip" \
            HEAD

          cat > release-output/info.txt <<'EOF'
          AS Academy Basic 1.0.0
          ======================
          Package: com.asdevelopers.academy.basic
          Version Name: 1.0.0
          Version Code: 9
          Course Schema: 1
          Minimum Core: 1.2.0
          Target SDK: 36
          Min SDK: 23

          Publish APK: AS-Academy-Basic-1.0.0.apk
          Debug APK: AS-Academy-Basic-1.0.0-debug.apk
          Source: source.as-academy-basic-1.0.0.zip
          Signature verification: signature-verify.txt
          Checksums: SHA256SUMS.txt

          Signing key material is NOT public. The encrypted file
          AS-Academy-Basic-1.0.0-signing-private.cms contains the keystore and passwords.
          Decrypt it only with the private release-pack key delivered separately to the owner.
          EOF

          cat > release-output/DECRYPT_SIGNING_PACK.txt <<'EOF'
          Decrypt the private signing pack with OpenSSL:

          openssl cms -decrypt -binary -inform DER \
            -in AS-Academy-Basic-1.0.0-signing-private.cms \
            -recip release-pack-public-cert.pem \
            -inkey AS-Academy-Basic-release-pack-private-key.pem \
            -out signing-private-pack.tar.gz

          Then extract:
          tar -xzf signing-private-pack.tar.gz

          Keep the decrypted keystore, info.txt and the private release-pack key offline and private.
          EOF

          find release-output -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum > release-output/SHA256SUMS.txt

          cp AS-Academy-Basic/CHANGELOG.md release-output/CHANGELOG.md

      # One convenience ZIP contains all non-plaintext-secret deliverables.
      - name: Create final release pack ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd release-output
          zip -9 AS-Academy-Basic-1.0.0-release-pack.zip \
            AS-Academy-Basic-1.0.0.apk \
            AS-Academy-Basic-1.0.0-debug.apk \
            source.as-academy-basic-1.0.0.zip \
            info.txt \
            SHA256SUMS.txt \
            signature-verify.txt \
            CHANGELOG.md \
            DECRYPT_SIGNING_PACK.txt \
            AS-Academy-Basic-1.0.0-signing-private.cms \
            release-pack-public-cert.pem

      - name: Upload complete release pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: AS-Academy-Basic-1.0.0-release-pack
          path: release-output/*
          if-no-files-found: error
          retention-days: 90

      # The public GitHub Release contains signed binaries and an encrypted signing backup, never plaintext secrets.
      - name: Publish GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # AS Academy Basic 1.0.0

          نخستین نسخه Stable دوره پایه مشترک برنامه‌نویسی AS Academy.

          - 4 سطح / 39 فصل / 157 درس
          - 73 Quiz / 534 سؤال
          - 195 Exercise / 40 Challenge
          - 14 Project + Final Capstone
          - Placement، Weak Topic Review و Spaced Review
          - Android package: `com.asdevelopers.academy.basic`
          - versionCode: `9`

          فایل Publish با نام `AS-Academy-Basic-1.0.0.apk` امضا و با `apksigner` تأیید شده است.
          EOF

          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.0.0 --repo "$GITHUB_REPOSITORY" --title "AS Academy Basic 1.0.0" --notes-file release-notes.md
          else
            gh release create v1.0.0 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "AS Academy Basic 1.0.0" --notes-file release-notes.md
          fi

          gh release upload v1.0.0 --repo "$GITHUB_REPOSITORY" --clobber \
            release-output/AS-Academy-Basic-1.0.0.apk \
            release-output/AS-Academy-Basic-1.0.0-debug.apk \
            release-output/AS-Academy-Basic-1.0.0-release-pack.zip \
            release-output/AS-Academy-Basic-1.0.0-signing-private.cms \
            release-output/release-pack-public-cert.pem \
            release-output/source.as-academy-basic-1.0.0.zip \
            release-output/info.txt \
            release-output/SHA256SUMS.txt \
            release-output/signature-verify.txt \
            release-output/CHANGELOG.md \
            release-output/DECRYPT_SIGNING_PACK.txt
