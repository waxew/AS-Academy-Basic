name: Remove legacy Basic course snapshot

on:
  push:
    branches: [architecture/maincourse-mainui]
    paths:
      - ".github/workflows/remove-legacy-basic-course.yml"

permissions:
  contents: write

jobs:
  remove-legacy-course:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v5
        with:
          ref: architecture/maincourse-mainui
          fetch-depth: 0

      - name: Remove duplicated Course Package and this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          test -d course/basic
          git rm -r course/basic
          git rm .github/workflows/remove-legacy-basic-course.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: remove duplicated Basic course snapshot"
          git pull --rebase origin architecture/maincourse-mainui
          git push origin HEAD:architecture/maincourse-mainui
