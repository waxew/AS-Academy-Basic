name: One-time About version hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-about-version.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Replace hard-coded About version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/kotlin/com/asdevelopers/academy/basic/BasicAcademyApp.kt")
          text = path.read_text(encoding="utf-8")
          old = 'versionName = "0.1.0"'
          new = 'versionName = BuildConfig.VERSION_NAME'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one hard-coded About version, found {count}.")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Remove one-time workflow
        run: git rm .github/workflows/patch-about-version.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/asdevelopers/academy/basic/BasicAcademyApp.kt
          git commit -m "Use BuildConfig version in About screen"
          git push
