name: Phase 12 Learning Catalog finalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize-catalog:
    if: github.head_ref == 'phase-12-learning-catalog'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Basic feature branch
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-Basic
          ref: phase-12-learning-catalog
          path: AS-Academy-Basic

      - name: Wire Core 1.3.0 Learning Catalog and bump Basic to 0.2.7
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('AS-Academy-Basic')
          app_path = root / 'app/src/main/kotlin/com/asdevelopers/academy/basic/BasicAcademyApp.kt'
          text = app_path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import com.asdevelopers.academy.core.navigation.openFlashcardReview\n',
              'import com.asdevelopers.academy.core.navigation.openFlashcardReview\n'
              'import com.asdevelopers.academy.core.navigation.openLearningCatalog\n',
              'navigation import'
          )
          replace_once(
              'import com.asdevelopers.academy.core.ui.screens.AcademyFlashcardReviewScreen\n',
              'import com.asdevelopers.academy.core.ui.screens.AcademyFlashcardReviewScreen\n'
              'import com.asdevelopers.academy.core.ui.screens.AcademyLearningCatalogScreen\n',
              'catalog screen import'
          )

          drawer_old = '''        AcademyDrawerItem(
              id = "basic-flashcards",
              label = "مرور فلش‌کارت",
              icon = Icons.Outlined.MenuBook
          ) {
              navController.openFlashcardReview()
          }
      )'''
          drawer_new = '''        AcademyDrawerItem(
              id = "basic-flashcards",
              label = "مرور فلش‌کارت",
              icon = Icons.Outlined.MenuBook
          ) {
              navController.openFlashcardReview()
          },
          AcademyDrawerItem(
              id = "basic-learning-catalog",
              label = "تمرین و ارزیابی",
              icon = Icons.Outlined.MenuBook
          ) {
              // Catalog عمومی Core همه Quiz/Exercise/Projectهای Bundle را قابل جست‌وجو می‌کند.
              navController.openLearningCatalog()
          }
      )'''
          replace_once(drawer_old, drawer_new, 'drawer catalog item')

          replace_once(
              'onOpenFlashcards = { navController.openFlashcardReview() },\n                            modifier = Modifier.padding(paddingValues)',
              'onOpenFlashcards = { navController.openFlashcardReview() },\n'
              '                            onOpenCatalog = { navController.openLearningCatalog() },\n'
              '                            modifier = Modifier.padding(paddingValues)',
              'home catalog callback'
          )

          nav_end = '\n                )\n            }\n        }\n    }\n}\n\n/** صفحه خانه Basic داده را از Bundle می‌خواند و با اضافه شدن درس‌ها بدون تغییر کد رشد می‌کند. */'
          nav_index = text.find(nav_end)
          if nav_index < 0:
              raise SystemExit('NavHost end marker was not found')
          catalog_slot = ''',
                    learningCatalog = {
                        val currentBundle = bundle
                        if (currentBundle == null) {
                            BasicMessage(
                                message = "Course هنوز بارگذاری نشده است.",
                                modifier = Modifier.padding(paddingValues)
                            )
                        } else {
                            // Search، Filter و Cardهای Activity در Core هستند؛ Basic فقط Bundle و Routeها را تزریق می‌کند.
                            AcademyLearningCatalogScreen(
                                quizzes = currentBundle.quizzes,
                                exercises = currentBundle.exercises,
                                projects = currentBundle.projects,
                                onQuizClick = { quizId -> navController.openQuiz(quizId) },
                                onExerciseClick = { exerciseId -> navController.openExercise(exerciseId) },
                                onProjectClick = { projectId -> navController.openProject(projectId) },
                                modifier = Modifier.padding(paddingValues)
                            )
                        }
                    }'''
          text = text[:nav_index] + catalog_slot + text[nav_index:]

          replace_once(
              'onOpenFlashcards: () -> Unit,\n    modifier: Modifier = Modifier',
              'onOpenFlashcards: () -> Unit,\n    onOpenCatalog: () -> Unit,\n    modifier: Modifier = Modifier',
              'home signature'
          )
          replace_once(
              '''                    Button(onClick = onOpenFlashcards, modifier = Modifier.fillMaxWidth()) {
                        Text("مرور فلش‌کارت")
                    }''',
              '''                    Button(onClick = onOpenFlashcards, modifier = Modifier.fillMaxWidth()) {
                        Text("مرور فلش‌کارت")
                    }
                    Button(onClick = onOpenCatalog, modifier = Modifier.fillMaxWidth()) {
                        Text("مرکز تمرین و ارزیابی")
                    }''',
              'home catalog button'
          )
          app_path.write_text(text, encoding='utf-8')

          manifest_path = root / 'course/basic/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('version') != '0.2.6' or manifest.get('curriculumVersion') != '0.2.6':
              raise SystemExit('Unexpected Basic manifest version before Phase 12')
          manifest['version'] = '0.2.7'
          manifest['curriculumVersion'] = '0.2.7'
          manifest['minimumCoreVersion'] = '1.3.0'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          build_path = root / 'app/build.gradle.kts'
          build = build_path.read_text(encoding='utf-8')
          replacements = [
              ('versionCode = 8', 'versionCode = 9'),
              ('versionName = "0.2.6"', 'versionName = "0.2.7"'),
              ('implementation("com.asdevelopers.academy:core:1.2.0")', 'implementation("com.asdevelopers.academy:core:1.3.0")'),
              ('// 0.2.6 بیست Micro Quiz پنج‌سؤالی را برای تشخیص سریع ضعف‌های چهار سطح اضافه می‌کند.', '// 0.2.7 مرکز تمرین و ارزیابی Core 1.3.0 را به Host واقعی Basic متصل می‌کند.'),
              ('// 1.2.0 شامل Placement، Weak Topic Review، Spaced Review، Persistence و Navigation مشترک است.', '// 1.3.0 علاوه بر Adaptive Learning، Learning Catalog مشترک Quiz/Exercise/Project را فراهم می‌کند.')
          ]
          for old, new in replacements:
              if build.count(old) != 1:
                  raise SystemExit(f'build replacement missing or duplicated: {old}')
              build = build.replace(old, new, 1)
          build_path.write_text(build, encoding='utf-8')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          readme_replacements = [
              ('- Core: `AS-Academy-Core >= 1.2.0`', '- Core: `AS-Academy-Core >= 1.3.0`'),
              ('- Course/Host: **0.2.6**', '- Course/Host: **0.2.7**'),
              ('- Android `versionCode`: **8**', '- Android `versionCode`: **9**'),
              ('`versionCode=8 / versionName=0.2.6`', '`versionCode=9 / versionName=0.2.7`'),
              ('`Four-level curriculum covered / Adaptive learning active / 195 exercises / 534 questions / Micro Quiz validation in progress`', '`Four-level curriculum covered / Adaptive learning active / 195 exercises / 534 questions / Learning Catalog integrated`')
          ]
          for old, new in readme_replacements:
              if readme.count(old) != 1:
                  raise SystemExit(f'README replacement missing or duplicated: {old}')
              readme = readme.replace(old, new, 1)

          catalog_doc = '''## مرکز تمرین و ارزیابی — Core 1.3.0

Basic از `AcademyLearningCatalogScreen` و Route عمومی `academy/catalog` استفاده می‌کند. این صفحه بدون ساخت UI موازی در Course، تمام Quiz، Exercise و Projectهای Bundle را با Search، فیلتر نوع، شمارنده و metadata استاندارد نمایش می‌دهد.

- ورودی Catalog مستقیماً `bundle.quizzes`، `bundle.exercises` و `bundle.projects` است.
- انتخاب Quiz به `openQuiz`، Exercise به `openExercise` و Project به `openProject` می‌رود.
- دسترسی از Drawer با «تمرین و ارزیابی» و از Home با «مرکز تمرین و ارزیابی» فراهم است.
- Search/Filter/Cardها در `AS-Academy-Core` نگهداری می‌شوند و Basic هیچ Fork یا پیاده‌سازی تکراری ندارد.

'''
          heading = '## وضعیت Android و QA\n'
          if readme.count(heading) != 1:
              raise SystemExit('README Android QA heading not found exactly once')
          readme = readme.replace(heading, catalog_doc + heading, 1)

          version_entry = '''### 0.2.7 — Core 1.3.0 Learning Catalog

- اتصال `AcademyLearningCatalogScreen` به Bundle واقعی Basic
- دسترسی Catalog از Drawer و Home
- Search و Filter مشترک برای 73 Quiz، 195 Exercise و 14 Project
- استفاده از Routeهای مشترک Quiz/Exercise/Project بدون UI تکراری در Basic
- ارتقای `minimumCoreVersion` و dependency به Core 1.3.0
- افزایش Android versionCode به 9

'''
          marker = '### 0.2.6 — Micro Quiz checkpoints\n'
          if readme.count(marker) != 1:
              raise SystemExit('README 0.2.6 marker not found exactly once')
          readme = readme.replace(marker, version_entry + marker, 1)
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Checkout AS Academy Core 1.3.0+
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-Core
          ref: main
          path: AS-Academy-Core

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Basic Course Package
        working-directory: AS-Academy-Core
        run: ./gradlew :tools:run --args="validate ../AS-Academy-Basic/course/basic" --stacktrace

      - name: Compile Android Course Bundle
        working-directory: AS-Academy-Core
        run: ./gradlew :tools:run --args="compile ../AS-Academy-Basic/course/basic ../AS-Academy-Basic/app/src/main/assets/basic-course.json" --stacktrace

      - name: Lint and build patched Basic debug APK
        working-directory: AS-Academy-Basic
        run: ../AS-Academy-Core/gradlew -p . :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload patched Basic debug APK
        uses: actions/upload-artifact@v4
        with:
          name: basic-phase12-catalog-${{ github.event.pull_request.head.sha }}
          path: AS-Academy-Basic/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Remove temporary finalizer from main
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-Basic
          ref: main
          path: AS-Academy-Cleanup

      - name: Commit finalizer cleanup to main
        shell: bash
        working-directory: AS-Academy-Cleanup
        run: |
          rm .github/workflows/phase12-catalog-finalizer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove temporary Phase 12 catalog finalizer"
          git push origin HEAD:main

      - name: Commit tested Phase 12 host to feature branch
        shell: bash
        working-directory: AS-Academy-Basic
        run: |
          rm -f docs/.phase12-finalizer-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate Core 1.3.0 learning catalog"
          git push origin HEAD:phase-12-learning-catalog
