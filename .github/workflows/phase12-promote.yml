name: Promote validated Phase 12 Learning Catalog

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    if: github.head_ref == 'phase-12-learning-catalog'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 12
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-Basic
          ref: phase-12-learning-catalog
          path: AS-Academy-Basic

      - name: Check Phase 12 readiness
        id: ready
        shell: bash
        run: |
          if grep -q '"version": "0.2.7"' AS-Academy-Basic/course/basic/manifest.json \
            && grep -q 'minimumCoreVersion": "1.3.0"' AS-Academy-Basic/course/basic/manifest.json \
            && grep -q 'openLearningCatalog' AS-Academy-Basic/app/src/main/kotlin/com/asdevelopers/academy/basic/BasicAcademyApp.kt \
            && grep -q 'AcademyLearningCatalogScreen' AS-Academy-Basic/app/src/main/kotlin/com/asdevelopers/academy/basic/BasicAcademyApp.kt; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Phase 12 finalizer has not produced the complete 0.2.7 host yet.'
          fi

      - name: Checkout AS Academy Core
        if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-Core
          ref: main
          path: AS-Academy-Core

      - name: Set up JDK 17
        if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.ready.outputs.ready == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        if: steps.ready.outputs.ready == 'true'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        if: steps.ready.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Basic 0.2.7 Course Package
        if: steps.ready.outputs.ready == 'true'
        working-directory: AS-Academy-Core
        run: ./gradlew :tools:run --args="validate ../AS-Academy-Basic/course/basic" --stacktrace

      - name: Compile Basic 0.2.7 Course Bundle
        if: steps.ready.outputs.ready == 'true'
        working-directory: AS-Academy-Core
        run: ./gradlew :tools:run --args="compile ../AS-Academy-Basic/course/basic ../AS-Academy-Basic/app/src/main/assets/basic-course.json" --stacktrace

      - name: Lint and build final Basic 0.2.7 debug APK
        if: steps.ready.outputs.ready == 'true'
        working-directory: AS-Academy-Basic
        run: ../AS-Academy-Core/gradlew -p . :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload final Phase 12 debug APK
        if: steps.ready.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: basic-0.2.7-catalog-${{ github.event.pull_request.head.sha }}
          path: AS-Academy-Basic/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Checkout current main for promotion
        if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-Basic
          ref: main
          fetch-depth: 0
          path: AS-Academy-Promote

      - name: Merge validated Phase 12 and remove temporary automation
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        working-directory: AS-Academy-Promote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin phase-12-learning-catalog
          git merge --no-ff --no-commit origin/phase-12-learning-catalog
          git rm -f --ignore-unmatch .github/workflows/phase12-catalog-finalizer.yml
          git rm -f --ignore-unmatch .github/workflows/phase12-promote.yml
          git rm -f --ignore-unmatch docs/.phase12-finalizer-trigger
          git rm -f --ignore-unmatch docs/.phase12-promote-trigger
          git diff --cached --check
          git commit -m "Promote Basic 0.2.7 learning catalog"
          git push origin HEAD:main
