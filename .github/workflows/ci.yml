name: Basic quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI فقط Repositoryها را می‌خواند و هیچ Permission نوشتن نیاز ندارد.
permissions:
  contents: read

# اجرای جدید همان Branch، اجرای قدیمی را لغو می‌کند تا Artifact منسوخ تولید نشود.
concurrency:
  group: basic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate course and build Android host
    runs-on: ubuntu-latest
    steps:
      # Basic داخل زیرپوشه قرار می‌گیرد تا Core در کنار آن Checkout شود و Composite Build همان layout محلی را داشته باشد.
      - name: Checkout Basic
        uses: actions/checkout@v5
        with:
          path: AS-Academy-Basic

      # Core منبع رسمی Contract، Compiler، Runtime و Gradle Wrapper این Course است.
      - name: Checkout AS Academy Core
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-Core
          path: AS-Academy-Core

      # نسخه Java دقیقاً با Core یکسان نگه داشته می‌شود.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android API و Build Tools مورد استفاده Core برای Host نیز نصب می‌شوند.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # Cache رسمی Gradle زمان Buildهای بعدی را کاهش می‌دهد.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # همان Validator Runtime قبل از ساخت APK روی فایل‌های قابل ویرایش اجرا می‌شود.
      - name: Validate Basic Course Package
        working-directory: AS-Academy-Core
        run: ./gradlew :tools:run --args="validate ../AS-Academy-Basic/course/basic" --stacktrace

      # Bundle واحد فقط از Source معتبر ساخته و مستقیم داخل Android assets قرار داده می‌شود.
      - name: Compile Android Course Bundle
        working-directory: AS-Academy-Core
        run: ./gradlew :tools:run --args="compile ../AS-Academy-Basic/course/basic ../AS-Academy-Basic/app/src/main/assets/basic-course.json" --stacktrace

      # Wrapper Core پروژه Basic را با Composite Build و همان Runtime مشترک Lint و Build می‌کند.
      - name: Lint and build Basic debug APK
        working-directory: AS-Academy-Basic
        run: ../AS-Academy-Core/gradlew -p . :app:lintDebug :app:assembleDebug --stacktrace

      # Release variant نیز قبل از امضای خصوصی ساخته می‌شود تا خطاهای مخصوص Release زودتر دیده شوند.
      - name: Build unsigned Basic release APK
        working-directory: AS-Academy-Basic
        run: ../AS-Academy-Core/gradlew -p . :app:assembleRelease --stacktrace

      # SHA-256 خروجی‌های QA برای مقایسه و ثبت reproducibility نگهداری می‌شود.
      - name: Generate QA checksums
        shell: bash
        run: |
          sha256sum AS-Academy-Basic/app/build/outputs/apk/debug/app-debug.apk > AS-Academy-Basic/app/build/outputs/apk/debug/app-debug.apk.sha256
          RELEASE_APK=$(find AS-Academy-Basic/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > "$RELEASE_APK.sha256"

      # APK Debug برای تست هر Commit به‌عنوان Artifact نگهداری می‌شود.
      - name: Upload Basic debug APK
        uses: actions/upload-artifact@v4
        with:
          name: basic-debug-${{ github.sha }}
          path: |
            AS-Academy-Basic/app/build/outputs/apk/debug/app-debug.apk
            AS-Academy-Basic/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

      # Release unsigned فقط QA است؛ فایل Publish نهایی خارج از repo با کلید خصوصی پایدار امضا می‌شود.
      - name: Upload unsigned Basic release APK
        uses: actions/upload-artifact@v4
        with:
          name: basic-release-unsigned-${{ github.sha }}
          path: |
            AS-Academy-Basic/app/build/outputs/apk/release/*.apk
            AS-Academy-Basic/app/build/outputs/apk/release/*.sha256
          if-no-files-found: error
