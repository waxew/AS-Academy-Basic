name: Basic quality gates

on:
  push:
    branches: [main, "architecture/**", "release/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Foundation v1.5 -> MainCourse -> Basic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Basic
        uses: actions/checkout@v5
        with:
          path: AS-Academy-Basic

      # RC3 integration pins every shared input to an immutable commit while the cross-repo migration is validated.
      - name: Checkout AS Academy Core
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-Core
          ref: fdef97043080f51e5a1e5bff4b8d5374543e3365
          path: AS-Academy-Core

      - name: Checkout AS Academy MainUi
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-MainUi
          ref: 12998a6e2103ef9ae3e0ba4e40096328436acc4f
          path: AS-Academy-MainUi

      - name: Checkout AS Academy MainCourse
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-MainCourse
          ref: ef1a69fa23c86af50275ee7ead38641f1643228b
          path: AS-Academy-MainCourse

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Foundation integration contract
        working-directory: AS-Academy-Core
        run: python3 integration/validate_contract.py --peer ../AS-Academy-MainUi/integration/contract.json --peer ../AS-Academy-MainCourse/integration/contract.json

      - name: Run Core unit gates
        working-directory: AS-Academy-Core
        run: ./gradlew :engine:test :core:testDebugUnitTest --stacktrace

      - name: Validate canonical Basic Course Package
        working-directory: AS-Academy-Core
        run: ./gradlew :tools:run --args="validate ../AS-Academy-MainCourse/courses/basic/course" --stacktrace

      - name: Compile MainCourse Basic bundle for Android
        working-directory: AS-Academy-Core
        run: ./gradlew :tools:run --args="compile ../AS-Academy-MainCourse/courses/basic/course ../AS-Academy-Basic/app/src/main/assets/basic-course.json" --stacktrace

      - name: Lint and build shared MainUi
        run: ./AS-Academy-Core/gradlew -p AS-Academy-MainUi :main-ui:lintDebug :main-ui:assembleDebug --stacktrace

      - name: Lint and build Basic debug APK
        working-directory: AS-Academy-Basic
        run: ../AS-Academy-Core/gradlew -p . :app:lintDebug :app:assembleDebug --stacktrace

      - name: Build unsigned Basic release APK
        working-directory: AS-Academy-Basic
        run: ../AS-Academy-Core/gradlew -p . :app:assembleRelease --stacktrace

      - name: Generate QA checksums
        shell: bash
        run: |
          sha256sum AS-Academy-Basic/app/build/outputs/apk/debug/app-debug.apk > AS-Academy-Basic/app/build/outputs/apk/debug/app-debug.apk.sha256
          RELEASE_APK=$(find AS-Academy-Basic/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > "$RELEASE_APK.sha256"

      - name: Upload Basic debug APK
        uses: actions/upload-artifact@v4
        with:
          name: basic-debug-${{ github.sha }}
          path: |
            AS-Academy-Basic/app/build/outputs/apk/debug/app-debug.apk
            AS-Academy-Basic/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

      - name: Upload unsigned Basic release APK
        uses: actions/upload-artifact@v4
        with:
          name: basic-release-unsigned-${{ github.sha }}
          path: |
            AS-Academy-Basic/app/build/outputs/apk/release/*.apk
            AS-Academy-Basic/app/build/outputs/apk/release/*.sha256
          if-no-files-found: error
